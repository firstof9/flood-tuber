name: Build Linux Plugin

on:
  push:
    branches:
      - master
      - main
      - linux-compile
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - linux-compile

jobs:
  build-linux:
    name: Build Linux 🐧
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libwebp-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build

      - name: Prepare Linux artifacts
        run: |
          mkdir -p dist/flood-tuber/bin/64bit
          mkdir -p dist/flood-tuber/data
          cp build/flood-tuber.so dist/flood-tuber/bin/64bit/
          cp -r data/* dist/flood-tuber/data/
          cd dist && tar -czvf ../flood-tuber-linux.tar.gz flood-tuber

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: flood-tuber-linux
          path: flood-tuber-linux.tar.gz
