name: Build Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libobs-dev \
            libwebp-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build

      - name: Prepare Linux artifacts
        run: |
          mkdir -p dist/flood-tuber/bin/64bit
          mkdir -p dist/flood-tuber/data
          cp build/flood-tuber.so dist/flood-tuber/bin/64bit/
          cp -r data/* dist/flood-tuber/data/
          cd dist && tar -czvf ../flood-tuber-linux.tar.gz flood-tuber

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: flood-tuber-linux
          path: flood-tuber-linux.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup OBS Studio headers / dependencies
        shell: pwsh
        run: |
          # Fetch obs-studio pre-built dependencies / libobs or build with obs-studio
          # This job configures the standard Windows build
          Write-Host "Windows build environment setup"

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release
        continue-on-error: true
